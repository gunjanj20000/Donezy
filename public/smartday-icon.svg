<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg-grad)" filter="url(#shadow)" />
  
  <!-- Subtle inner shine -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- Modern check & clock accent -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Sparkle accent -->
    <path d="M420 80 Q430 110 460 120 Q430 130 420 160 Q410 130 380 120 Q410 110 420 80 Z" fill="#FDE047" opacity="0.9" />
    
    <!-- White stylized checkmark circle -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="28" stroke-dasharray="8 12"/>
    <path d="M168 256 L232 320 L352 192" fill="none" stroke="url(#check-grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
